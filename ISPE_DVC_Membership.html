<!DOCTYPE html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream:     #F8F4EE;
    --parchment: #EDE8DF;
    --stone:     #D8D2C8;
    --ink:       #1A1714;
    --mid:       #4A4440;
    --muted:     #8C857C;
    --red:       #C8202F;
    --blue:      #1B4DB8;
    --navy:      #1B3A6B;
  }

  body {
    font-family: 'Outfit', system-ui, sans-serif;
    background: var(--cream);
    color: var(--ink);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.4;
  }

  ::-webkit-scrollbar { height: 4px; width: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--stone); border-radius: 4px; }
  button { font-family: 'Outfit', system-ui, sans-serif; }

  /* ─── SITE NAV ─── */
  .site-nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 48px;
    height: 60px;
    background: rgba(248,244,238,0.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--parchment);
  }
  .site-wordmark {
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    letter-spacing: -0.3px;
  }
  .site-wordmark .r { color: var(--red); }
  .site-nav-items {
    display: flex;
    align-items: center;
    gap: 36px;
    list-style: none;
  }
  .site-nav-items a {
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.15s;
  }
  .site-nav-items a:hover { color: var(--ink); }
  .site-nav-current {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--blue);
  }
  .site-nav-hamburger {
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px 2px;
    z-index: 510;
  }
  .site-nav-hamburger span {
    display: block;
    width: 22px;
    height: 1.5px;
    background: var(--ink);
    transition: transform 0.2s ease, opacity 0.2s ease;
    transform-origin: center;
  }
  .site-nav-hamburger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
  .site-nav-hamburger.open span:nth-child(2) { opacity: 0; }
  .site-nav-hamburger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }
  .site-mobile-nav {
    display: none;
    position: fixed;
    top: 60px; left: 0; right: 0;
    background: rgba(248,244,238,0.97);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--parchment);
    padding: 8px 24px 24px;
    z-index: 490;
    flex-direction: column;
  }
  .site-mobile-nav.open { display: flex; }
  .site-mobile-nav a {
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--ink);
    text-decoration: none;
    padding: 15px 0;
    border-bottom: 1px solid var(--parchment);
    transition: color 0.15s;
  }
  .site-mobile-nav a:last-child { border-bottom: none; }
  .site-mobile-nav a:hover { color: var(--blue); }

  @media (max-width: 800px) {
    .site-nav { padding: 0 24px; }
    .site-nav-items { display: none; }
    .site-nav-hamburger { display: flex; }
  }
</style>

    <li><a href="ispe/index.html">ISPE Committee</a></li>
    <li><span class="site-nav-current">Roadmap</span></li>

  <button class="site-nav-hamburger" id="siteNavToggle" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>
</nav>
<div class="site-mobile-nav" id="siteNavMobile">
  <a href="index.html">Home</a>
  <a href="ispe/index.html">ISPE Committee</a>
  <a href="#">Roadmap</a>
</div>

<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const B = {
  navy:    "#1B3A6B",
  blue:    "#1B4DB8",
  lblue:   "#E8EDF8",
  sky:     "#3A7BD5",
  gold:    "#B8860B",
  lgold:   "#FDF8EE",
  green:   "#2E7D32",
  lgreen:  "#F0F7F0",
  orange:  "#C84B00",
  lorange: "#FFF4EE",
  red:     "#C8202F",
};

const N = {
  bg:      "#F8F4EE",
  surface: "#FFFFFF",
  stone:   "#D8D2C8",
  ink:     "#1A1714",
  mid:     "#4A4440",
  muted:   "#8C857C",
  ghost:   "#EDE8DF",
};

const TABS = [
  {id:"overview",   label:"Overview",       dot:B.blue},
  {id:"roadmap",    label:"Roadmap",        dot:B.green},
  {id:"roles",      label:"Roles",          dot:B.sky},
  {id:"el",         label:"Emerging Leaders", dot:B.gold},
  {id:"cadence",    label:"Cadence",        dot:B.green},
  {id:"metrics",    label:"Metrics",        dot:B.blue},
  {id:"asks",       label:"Corporate Asks", dot:B.orange},
];

const Dot = ({color}) => (
  <span style={{display:"inline-block",width:8,height:8,
    borderRadius:"50%",background:color,flexShrink:0}}/>
);

const Mark = ({color, children}) => (
  <span style={{
    display:"inline-flex", alignItems:"center", gap:5,
    background: color + "18",
    color: color,
    border: `1px solid ${color}40`,
    borderRadius:4, padding:"2px 9px",
    fontSize:11, fontWeight:600, letterSpacing:"0.3px",
    whiteSpace:"nowrap",
  }}>{children}</span>
);

const Rule = ({color}) => (
  <div style={{height:2, background:color||N.stone, borderRadius:1,
    margin:"10px 0 18px", width:36}}/>
);

const Display = ({children, style={}}) => (
  <h2 style={{
    fontFamily:"'Cormorant Garamond', Georgia, serif",
    fontSize:30, fontWeight:300, color:N.ink,
    letterSpacing:"-0.5px", lineHeight:1.15, ...style
  }}>{children}</h2>
);

const Sub = ({children, style={}}) => (
  <p style={{fontSize:12, fontWeight:600, color:N.muted,
    textTransform:"uppercase", letterSpacing:"1.2px", ...style}}>
    {children}
  </p>
);

const Card = ({children, style={}, color}) => (
  <div style={{
    background:N.surface, border:`1px solid ${N.stone}`,
    borderRadius:10, padding:"20px 22px",
    borderLeft: color ? `3px solid ${color}` : undefined,
    ...style,
  }}>{children}</div>
);

const SectionHead = ({children, accent=B.blue}) => (
  <div style={{marginBottom:20}}>
    <Rule color={accent}/>
    <Display>{children}</Display>
  </div>
);

const Tbl = ({headers, rows}) => (
  <div style={{overflowX:"auto", borderRadius:8, border:`1px solid ${N.stone}`}}>
    <table style={{width:"100%", borderCollapse:"collapse", fontSize:12}}>
      <thead>
        <tr>{headers.map((h,i) => (
          <th key={i} style={{
            background:B.navy, color:"#fff",
            padding:"9px 13px", textAlign:"left",
            fontWeight:600, fontSize:11,
            textTransform:"uppercase", letterSpacing:"0.7px",
            whiteSpace:"nowrap",
          }}>{h}</th>
        ))}</tr>
      </thead>
      <tbody>{rows.map((row,i) => (
        <tr key={i} style={{background:i%2===0?N.surface:N.ghost}}>
          {row.map((cell,j) => (
            <td key={j} style={{
              padding:"8px 13px", borderBottom:`1px solid ${N.stone}`,
              verticalAlign:"top", lineHeight:1.55, color:N.mid, fontSize:12,
            }}>{cell}</td>
          ))}
        </tr>
      ))}</tbody>
    </table>
  </div>
);

const Phase = ({num, days, color, headline, actions, owner, success, obstacle, workaround}) => {
  const [open, setOpen] = useState(false);
  return (
    <div style={{marginBottom:12, border:`1px solid ${N.stone}`, borderRadius:10, overflow:"hidden"}}>
      <button onClick={()=>setOpen(!open)} style={{
        width:"100%", background:open?N.surface:N.ghost,
        border:"none", padding:"16px 20px", cursor:"pointer",
        display:"flex", justifyContent:"space-between", alignItems:"center",
        textAlign:"left", transition:"background 0.15s",
      }}>
        <div style={{display:"flex", alignItems:"center", gap:14}}>
          <div style={{
            width:36, height:36, borderRadius:"50%",
            background:color, flexShrink:0,
            display:"flex", alignItems:"center", justifyContent:"center",
            fontFamily:"'Cormorant Garamond',serif",
            color:"#fff", fontSize:20, fontWeight:400,
          }}>{num}</div>
          <div>
            <div style={{fontSize:11, fontWeight:600, color:N.muted,
              letterSpacing:"0.8px", textTransform:"uppercase", marginBottom:2}}>{days}</div>
            <div style={{fontSize:15, fontWeight:600, color:N.ink}}>{headline}</div>
          </div>
        </div>
        <span style={{fontSize:18, color:N.muted, userSelect:"none", marginLeft:12}}>
          {open?"−":"+"}
        </span>
      </button>
      {open && (
        <div style={{padding:"20px", background:N.surface, borderTop:`1px solid ${N.stone}`}}>
          <div style={{display:"grid", gridTemplateColumns:"3fr 2fr", gap:20}}>
            <div>
              <Sub style={{marginBottom:10}}>Priority Actions</Sub>
              {actions.map((a,i) => (
                <div key={i} style={{display:"flex", gap:10, marginBottom:9}}>
                  <span style={{
                    color:"#fff", background:color, borderRadius:"50%",
                    width:20, height:20, minWidth:20,
                    display:"flex", alignItems:"center", justifyContent:"center",
                    fontSize:10, fontWeight:700, flexShrink:0, marginTop:1,
                  }}>{i+1}</span>
                  <span style={{fontSize:13, color:N.mid, lineHeight:1.55}}>{a}</span>
                </div>
              ))}
            </div>
            <div style={{display:"flex", flexDirection:"column", gap:8}}>
              {[
                {l:"Owner",              v:owner,      bg:N.ghost,     tc:N.mid},
                {l:"Success Signal",     v:success,    bg:B.lgreen,    tc:B.green},
                {l:"Likely Obstacle",    v:obstacle,   bg:B.lorange,   tc:B.orange},
                {l:"Workaround",         v:workaround, bg:B.lblue,     tc:B.blue},
              ].map((item,i)=>(
                <div key={i} style={{background:item.bg,borderRadius:8,padding:"9px 12px"}}>
                  <div style={{fontSize:10,fontWeight:700,color:item.tc,textTransform:"uppercase",letterSpacing:"0.8px",marginBottom:3}}>{item.l}</div>
                  <div style={{fontSize:12,color:N.ink,lineHeight:1.5}}>{item.val || item.v}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

function App() {
  const [tab, setTab] = useState("overview");

  return (
    <div style={{fontFamily:"'Outfit',system-ui,sans-serif",color:N.ink,minHeight:"100vh",background:N.bg,paddingTop:60}}>

      {/* Header */}
      <div style={{background:B.navy,padding:"28px 28px 0"}}>
        <div style={{maxWidth:980,margin:"0 auto"}}>
          <div style={{color:"rgba(255,255,255,0.5)",fontWeight:600,fontSize:11,letterSpacing:"2px",textTransform:"uppercase",marginBottom:6}}>
            ISPE Delaware Valley Chapter · Membership Committee
          </div>
          <h1 style={{
            fontFamily:"'Cormorant Garamond',Georgia,serif",
            color:"#fff", fontSize:38, fontWeight:300,
            lineHeight:1.1, margin:"0 0 6px",letterSpacing:"-1px"
          }}>90-Day Engagement Master Plan</h1>
          <div style={{color:"rgba(255,255,255,0.45)",fontSize:12,marginBottom:16}}>
            Engagement-First Rebuild · Q1–Q2 2026 · Dan Hall, Anthony Cicamore, Liah Osborne, Emily Kate Simard
          </div>
          <div style={{
            background:"rgba(27,77,184,0.35)",
            border:"1px solid rgba(27,77,184,0.5)",
            borderRadius:8, padding:"10px 16px",
            fontSize:13, color:"rgba(255,255,255,0.85)",
            marginBottom:0, lineHeight:1.7,
          }}>
            <span style={{fontWeight:700,color:"#fff"}}>North Star: </span>
            Membership follows belonging. Belonging follows engagement. Engagement follows promotion. We build the room first — membership follows naturally.
          </div>
          {/* Tabs */}
          <div style={{display:"flex",gap:0,marginTop:20,overflowX:"auto"}}>
            {TABS.map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)} style={{
                background: tab===t.id ? N.bg : "transparent",
                color: tab===t.id ? N.ink : "rgba(255,255,255,0.5)",
                border:"none", borderRadius:"8px 8px 0 0",
                padding:"10px 18px",
                fontWeight: tab===t.id ? 600 : 400,
                fontSize:13, cursor:"pointer",
                whiteSpace:"nowrap",
                display:"flex", alignItems:"center", gap:7,
                transition:"all 0.15s",
              }}>
                <Dot color={tab===t.id ? t.dot : "rgba(255,255,255,0.3)"}/>
                {t.label}
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* Body */}
      <div style={{maxWidth:980,margin:"0 auto",padding:"28px 16px 60px"}}>

        {/* OVERVIEW */}
        {tab==="overview" && (
          <div>
            <SectionHead>Where We Stand</SectionHead>

            <Card style={{marginBottom:16}}>
              <Sub style={{marginBottom:12}}>Current Situation</Sub>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
                {[
                  {label:"Membership Trend", desc:"Membership has declined significantly in recent years. Rebuilding requires getting people back in rooms first, not chasing renewals.", color:B.orange},
                  {label:"End-User Presence", desc:"End-user and owner/operator representation at events is critically low. We need their voices in the room as attendees, speakers, and hosts.", color:B.sky},
                  {label:"Upcoming Anchors", desc:"Three strong flagship events ahead: EL Role-Playing Event (Mar 20), Bioprocessing Program (Apr 9), Golf Outing (May 4). These are our campaign targets.", color:B.green},
                ].map((s,i)=>(
                  <div key={i} style={{background:N.ghost,borderRadius:8,padding:"14px 16px",borderTop:`3px solid ${s.color}`}}>
                    <div style={{fontSize:12,fontWeight:700,color:N.ink,marginBottom:6}}>{s.label}</div>
                    <div style={{fontSize:12,color:N.muted,lineHeight:1.65}}>{s.desc}</div>
                  </div>
                ))}
              </div>
            </Card>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:16}}>
              <Card color={B.green}>
                <Sub style={{marginBottom:10,color:B.green}}>What's Working</Sub>
                {[
                  "Strong historical chapter reputation — ISPE DVC is a known name in the region",
                  "Long-standing board relationships and warm connections across the industry",
                  "Strong contact lists and well-connected team members across firms and functions",
                  "Access to venues — Philadelphia-area pharma infrastructure is growing",
                  "Regional pharma investment is accelerating — we can attach to that momentum",
                  "EL pricing structure exists nationally: $46.80 EL member ticket, $15.30 virtual",
                  "Flagship events with real brand equity: Golf Outing, Symposium, Annual Gala",
                ].map((x,i)=>(
                  <div key={i} style={{fontSize:12,marginBottom:6,display:"flex",gap:8,alignItems:"flex-start"}}>
                    <span style={{color:B.green,fontWeight:700,flexShrink:0}}>✓</span>
                    <span style={{color:N.mid,lineHeight:1.55}}>{x}</span>
                  </div>
                ))}
              </Card>
              <Card color={B.orange}>
                <Sub style={{marginBottom:10,color:B.orange}}>What Isn't Working</Sub>
                {[
                  "No clear end-user champion in the region — we lack that anchor company or contact",
                  "Distribution relies on posting and emails that often go unseen",
                  "60–70% of registrations happen in the final 48 hours — no early momentum",
                  "No structured post-event follow-up loop of any kind",
                  "Emerging leader pipeline completely untapped despite favorable pricing",
                  "Expired members are not being contacted — no outreach or re-engagement channel",
                  "No data tracking: attendance trends, first-timers, repeat visitors — none of it",
                ].map((x,i)=>(
                  <div key={i} style={{fontSize:12,marginBottom:6,display:"flex",gap:8,alignItems:"flex-start"}}>
                    <span style={{color:B.orange,fontWeight:700,flexShrink:0}}>✗</span>
                    <span style={{color:N.mid,lineHeight:1.55}}>{x}</span>
                  </div>
                ))}
              </Card>
            </div>

            <Card style={{marginBottom:16}}>
              <Sub style={{marginBottom:12}}>90-Day Success Criteria</Sub>
              <Tbl headers={["Metric","Target by Day 90","Why It Matters"]} rows={[
                ["Total Event Attendance",        "Trending up event-over-event",            "The chapter lives and dies on bodies in the room"],
                ["First-Time Attendees",          "Track consistently — grow quarter-over-quarter", "New faces = new revenue, new relationships, future members"],
                ["End-User Org Representation",   "Meaningfully higher than today",          "End-user presence is the missing ingredient for relevance"],
                ["EL Attendees per Event",        "5+ per event by Day 60",                  "Lowest cost to acquire, highest long-term value"],
                ["Repeat Attendees (rolling)",    "Establish baseline, then grow",           "Repeat attendance = real belonging, not one-time curiosity"],
                ["Corporate Conversations",       "10+ warm outreach conversations logged",  "Relationship pipeline that unlocks internal distribution"],
              ]}/>
            </Card>

            <Card style={{background:B.lblue,border:`1px solid ${B.blue}30`}}>
              <Sub style={{marginBottom:8,color:B.blue}}>The Strategy in Plain Terms</Sub>
              <p style={{fontSize:13,marginBottom:10,color:N.ink,lineHeight:1.75}}>Every tactic in this plan does one of two things: it puts more people in the room, or it makes the people already in the room more likely to come back and eventually join. <strong>That is the membership strategy.</strong></p>
              <p style={{fontSize:13,color:N.mid,lineHeight:1.75}}>We're not chasing renewals or cold-pitching memberships. We're building the kind of community that makes membership feel obvious — because the value is already there, visible, and real. When people belong, they join. Our job is to make them belong first.</p>
            </Card>
          </div>
        )}

        {/* ROADMAP */}
        {tab==="roadmap" && (
          <div>
            <SectionHead>90-Day Roadmap</SectionHead>
            <p style={{fontSize:13,color:N.muted,marginBottom:20}}>Click each phase to expand full actions, owners, and success signals.</p>

            <Phase num="1" days="Days 1–30" color={B.blue}
              headline="Build the operating foundation. Nothing executes without rails."
              actions={[
                "Set up a shared digital workspace to centralize team coordination and replace scattered file dependency",
                "Assign and confirm 4 roles in writing — names to functions, flat structure, no hierarchy beyond coordination",
                "Build the corporate outreach target list: active board members and their employers, chapter sponsors, past presidents, known end-user contacts — organized by warmth",
                "Draft the one-page Corporate Ask Sheet: EL mission, pricing, escalating ask tiers, what's in it for them",
                "Identify the next 2–3 events on Ticket Tailor as named campaign anchors — every action ties to one of them",
                "Design the attendance tracking approach: what data do we need, where does it live, who pulls it after each event",
                "Draft the 72-hour post-event follow-up template — 3 sentences, one question, sent from a real person",
                "Set a recurring biweekly team check-in — same day, same time, low lift, no agenda theater",
                "First handoff to Programming/Marketing: share 3 topic signals we're hearing and 2 names of people who'd say yes to speaking",
                "Get visibility into Ticket Tailor — ensure all 4 team members can view the event pages and registration data",
              ]}
              owner="Dan Hall (Co-Chair) + full team alignment"
              success="Shared workspace is live, roles are confirmed, target list exists with warmth ratings, next event is the named campaign anchor, tracking approach is decided"
              obstacle="Volunteer inertia in week one — people agree to roles but the first small step doesn't happen"
              workaround="Assign specific, tiny outputs with a named date. Not 'own the tracker' — 'add 5 company names to the Notion doc by Thursday.' Small first steps create momentum."
            />

            <Phase num="2" days="Days 31–60" color={B.sky}
              headline="Launch the corporate outreach engine. Run the first complete event cycle."
              actions={[
                "Begin warm outreach to corporate contacts — always lead with Tier 1 ask (name someone internal who can champion ISPE to early-career staff)",
                "Secure first internal distribution channel: one company agrees to forward an event invite through internal email, Teams, or Slack",
                "Run the first full 72-hour post-event follow-up — log every response theme in the shared workspace",
                "Identify at least one end-user willing to speak, moderate, or be featured at a future event — pass that name to Programming",
                "Build the LinkedIn amplification pack for the next event: 3 short pre-written posts and a board repost prompt (copy-paste ready, no creative work required from board members)",
                "Work with Marketing to push event promotion earlier — advocate for the registration page to go live further out so reach has more runway",
                "Review first round of attendance data with the team — what moved, what didn't, what do we do differently",
                "Report back to Programming committee: here's what we heard, here are names, here's what the market is asking for",
                "Identify one company that could host a future EL happy hour — make the initial ask",
                "Begin building the expired member re-engagement approach — identify the list, design the outreach",
              ]}
              owner="All four — EL/Corporate outreach led by Liah + Anthony, distribution led by Emily Kate"
              success="3+ corporate conversations completed, 1 internal distribution channel secured, first follow-up loop done and logged, EL attendees tracked for the first time at an event"
              obstacle="Corporate contacts are warm but slow — they intend to help but it doesn't happen without a specific ask"
              workaround="Make every ask take 5 minutes to fulfill. 'Can you forward this to your team?' gets done. 'Can we plan a happy hour?' gets scheduled for next quarter."
            />

            <Phase num="3" days="Days 61–90" color={B.green}
              headline="Prove the model. Deliver visible results. Set up the next 90 days."
              actions={[
                "Host or co-host first EL happy hour at a corporate partner location — even an informal 60-min gathering counts",
                "Have at least one end-user voice featured at a chapter event (speaker, panelist, or moderator)",

            <SectionHead>Metrics Dashboard</SectionHead>
            <p style={{fontSize:13,color:N.muted,marginBottom:20}}>Track only what you can actually change. We are starting from near zero on data — that's fine. The goal in the first 30 days is to establish a baseline. Over time, consistent data on membership trends and event attendance becomes a real asset: the foundation for decisions the board can actually stand behind.</p>

              <Tbl headers={["Metric","Why It Matters","How to Capture","Review Cadence","What Good Looks Like"]} rows={[

                ["First-Time Attendees",      "New faces = new revenue and future members",             "Add 'Is this your first ISPE-DVC event?' to registration","Every event",  "Establish Q1 baseline; grow Q2+"],
                ["Repeat Attendees (rolling)","Repeat = real belonging, not just marketing",            "Cross-reference registrant email list over time",          "Quarterly",    "20%+ attended within prior 6 months"],
                ["EL Attendee Count",         "Lowest cost to acquire, highest lifetime value",        "Tag by ticket type in Ticket Tailor (EL/Student)",         "Every event",  "5+ per event by Day 60"],
                ["End-User Org Representation","End-user presence = chapter relevance",                "Capture employer/org at registration",                     "Every event",  "Growing meaningfully from current baseline"],
                ["Corporate Conversations",   "The relationship pipeline that unlocks distribution",   "Anthony's tracker in shared workspace",                    "Biweekly",     "10+ warm conversations logged by Day 60"],
                ["Post-Event Response Rate",  "Tells us if follow-up is landing and resonating",       "Track replies to Emily Kate's 72-hr message",              "Every event",  "20%+ reply rate; all themes logged"],
              ]}/>
            </Card>

            <Card style={{background:"#FFFBEB",border:"1px solid #D4A000",marginBottom:16}}>
              <Sub style={{marginBottom:8,color:"#7A5C00"}}>Data Access Is a Real Constraint — Here's How We Handle It</Sub>
              <p style={{fontSize:13,lineHeight:1.75,color:N.mid}}>Right now no one is pulling membership lists or running analytics. That's the starting line, not an excuse. The path forward: Dan maintains a simple shared tracker where attendance data from Ticket Tailor is logged after every event. Names and emails stay in the chapter's systems; the tracking sheet logs aggregate counts, ticket types, and org names where available. Start simple. The goal in 90 days is a baseline, not a BI dashboard.</p>
            </Card>

            <Card style={{background:B.lblue,border:"1px solid #c5d4f0",marginBottom:16}}>
              <Sub style={{marginBottom:8,color:B.blue}}>The Case for Data Analytics</Sub>
              <p style={{fontSize:13,color:N.mid,lineHeight:1.75,marginBottom:12}}>Right now decisions about programming, outreach, and investment are made on instinct. That's not a criticism — it's where every volunteer organization starts. But as we build our data foundation, we gain something more valuable: the ability to show the board what's actually working, make the case for resources with evidence, and identify the patterns that gut feel alone would miss.</p>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
                {[
                  {l:"Membership trends",   d:"Are we growing, holding, or declining quarter-over-quarter? Which event types drive the most new joins?"},
                  {l:"Event attendance",    d:"Who comes back? Which events bring first-timers? Where do we lose people between event one and event two?"},
                  {l:"Engagement pipeline",d:"Which corporate relationships converted to distribution wins? Which EL touchpoints led to membership? Connect the dots."},
                ].map((item,i)=>(
                  <div key={i} style={{background:N.surface,borderRadius:8,padding:"12px 14px"}}>
                    <div style={{fontSize:11,fontWeight:700,color:B.blue,marginBottom:5,textTransform:"uppercase",letterSpacing:"0.5px"}}>{item.l}</div>
                    <div style={{fontSize:12,color:N.mid,lineHeight:1.55}}>{item.d}</div>
                  </div>
                ))}
              </div>
            </Card>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
              <Card color={B.green}>
                <Sub style={{marginBottom:10,color:B.green}}>What "Good" Looks Like at Day 90</Sub>
                {["Attendance is clearly trending up — even one event with meaningful growth",
                  "First-timer data is being captured consistently for the first time",
                  "EL attendees are tracked and growing at each event",
                  "End-user org count is visibly higher than where we started",
                  "10+ corporate conversations logged with real outcomes noted",
                  "Board has seen a one-page metrics update with directional improvement"
                ].map((x,i)=>(
                  <div key={i} style={{fontSize:12,marginBottom:6,display:"flex",gap:8,alignItems:"flex-start"}}>
                    <span style={{color:B.green,flexShrink:0}}>✓</span>
                    <span style={{color:N.mid,lineHeight:1.55}}>{x}</span>
                  </div>
                ))}
              </Card>
              <Card color={B.orange}>
                <Sub style={{marginBottom:10,color:B.orange}}>Not Tracking Yet — By Design</Sub>
                {["Membership conversion rate — comes after engagement is established",
                  "LinkedIn follower count — vanity, not signal",
                  "Email open rates — too noisy in this environment",
                  "Revenue per event in isolation — needs context",
                  "Any metric we can't actually influence in this role"
                ].map((x,i)=>(
                  <div key={i} style={{fontSize:12,marginBottom:6,display:"flex",gap:8,alignItems:"flex-start"}}>
                    <span style={{color:B.orange,flexShrink:0}}>✗</span>
                    <span style={{color:N.mid,lineHeight:1.55}}>{x}</span>
                  </div>
                ))}
              </Card>
            </div>
          </div>
        )}

        {/* CORPORATE ASKS */}
        {tab==="asks" && (
          <div>
            <SectionHead>Corporate Ask System</SectionHead>

            <Card style={{background:B.navy,marginBottom:16}}>
              <Sub style={{marginBottom:8,color:"rgba(255,255,255,0.5)"}}>The One-Page Corporate Ask Sheet</Sub>
              <p style={{fontSize:12,color:"rgba(255,255,255,0.5)",marginBottom:14}}>This is the leave-behind. One page. Clean enough to forward internally. Adapt as needed per company.</p>
              <div style={{background:"rgba(255,255,255,0.06)",borderRadius:8,padding:"18px 20px",fontSize:13,lineHeight:1.9,color:"rgba(255,255,255,0.8)"}}>
                <div style={{fontWeight:300,color:"#fff",marginBottom:12,fontSize:22,fontFamily:"'Cormorant Garamond',serif",letterSpacing:"-0.3px"}}>ISPE Delaware Valley Chapter — Partner With Us</div>
                <strong style={{color:"#fff"}}>Who we are:</strong> The ISPE Delaware Valley Chapter is the professional home for pharmaceutical engineering and life sciences professionals across the Philadelphia region — one of the most pharma-dense areas in the world. Our Emerging Leaders Committee exists specifically to create a vibrant community for professionals entering the industry: connecting them with mentors, education, and each other.<br/><br/>
                <strong style={{color:"#fff"}}>What we're looking for from you:</strong><br/>
                We're not asking for a major commitment. We're asking for one of these, starting with whichever is easiest:<br/>
                <div style={{marginTop:10,marginLeft:8,display:"flex",flexDirection:"column",gap:8}}>
                  {[
                    ["Name someone internal","an admin, early-career lead, or office manager who can help amplify ISPE events to your team"],
                    ["Forward one event invite","share our next event to your internal channel. One email, two minutes."],
                    ["Host a casual happy hour","let us bring a 60-minute program to your office or a nearby space"],
                    ["Provide a voice","a speaker, moderator, or panelist from your team for a future chapter event"],
                  ].map(([title,desc],i)=>(
                    <div key={i} style={{display:"flex",gap:8}}>
                      <span style={{color:"rgba(255,255,255,0.4)",flexShrink:0}}>✦</span>
                      <span><strong style={{color:"#fff"}}>{title}</strong> — {desc}</span>
                    </div>
                  ))}
                </div><br/>
                <strong style={{color:"#fff"}}>What your early-career team gets:</strong> Access to the region's leading pharma professional network. Events starting at <strong style={{color:"#93B4F0"}}>$46.80</strong>. Full EL membership at <strong style={{color:"#93B4F0"}}>$121/year</strong>. Students attend free. A professional home at the exact moment in their career when it matters most.<br/><br/>
                <strong style={{color:"#fff"}}>What your company gets:</strong> Recognition as an industry supporter. A talent pipeline that connects your brand to professional growth. And frankly — better events, because your people are in the room.
              </div>
            </Card>

            <Card style={{marginBottom:16}}>
              <Sub style={{marginBottom:8}}>Corporate Pipeline Tracker</Sub>
              <p style={{fontSize:12,color:N.muted,marginBottom:12}}>Anthony owns this. Updated same day as every conversation. Shared in the workspace so the whole team has visibility.</p>
              <Tbl headers={["Company","Contact","Warmth","Source","Ask Made","Response","Commitment","Next Step","Date"]} rows={[
                ["[Company]","[Name]","Hot/Warm/Cold","Board/Sponsor/Network","Tier 1–5","Yes / Pending / No","Forward / Happy Hour / None","Send info / Confirm date / Follow up","[Date]"],
                ["...","...","...","...","...","...","...","...","..."],
              ]}/>
            </Card>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
              <Card>
                <Sub style={{marginBottom:12}}>Proposals to Bring to the Board</Sub>
                {[
                  {idea:"ISPE Ambassador Program",     detail:"Formal recognition tier for companies like CRB that consistently engage. Named supporter status, acknowledgment at events — currently in development, needs framework finalized."},
                  {idea:"EL Dollar Match Program",     detail:"Chapter and/or sponsors co-fund EL tickets or memberships. Gets end-user companies to send teams with minimal cost friction. High leverage, needs budget line."},
                  {idea:"Committee Prospectuses",      detail:"One-pager per committee: what the committee does, time commitment, what you'll gain. Can't recruit volunteers without something to recruit against. Assign to each chair."},
                  {idea:"AV Emergency Kit",            detail:"Single low-cost budget line item. A bad AV experience erodes credibility and energy. This is cheap insurance."},
                  {idea:"Text Reminder System",        detail:"For event reminders and membership renewals. High open rate, low cost, minimal lift. Bring a specific tool recommendation and cost estimate."},
                ].map((item,i)=>(
                  <div key={i} style={{marginBottom:12,paddingBottom:12,borderBottom:i<4?`1px solid ${N.stone}`:"none"}}>
                    <div style={{fontWeight:700,fontSize:12,color:N.ink}}>{item.idea}</div>
                    <div style={{fontSize:11,color:N.muted,marginTop:4,lineHeight:1.55}}>{item.detail}</div>
                  </div>
                ))}
              </Card>

              <Card>
                <Sub style={{marginBottom:12}}>8 Actions This Week</Sub>
                {[
                  {n:1, task:"Set up a shared digital workspace — centralize coordination, kill the scattered file dependency",       who:"Dan"},
                  {n:2, task:"Assign 4 roles in writing — names to functions, sent to the group",                    who:"Dan"},
                  {n:3, task:"Ensure all 4 members can view Ticket Tailor event pages",                              who:"Dan"},
                  {n:4, task:"Begin building the corporate target list — start with board member employers",          who:"Anthony"},
                  {n:5, task:"Schedule first outreach to known end-user contacts (Holly, Mike, Dan D, Michelle)",    who:"Anthony"},
                  {n:6, task:"Identify next 2 events as campaign anchors; note registration page status",            who:"Dan"},
                  {n:7, task:"Draft the one-page Corporate Ask Sheet",                                               who:"Dan + Emily Kate"},
                  {n:8, task:"Set recurring biweekly team check-in — same day, same time",                          who:"Dan"},
                ].map((item,i)=>(
                  <div key={i} style={{display:"flex",gap:10,marginBottom:10,alignItems:"flex-start"}}>
                    <div style={{
                      background:B.blue,color:"#fff",borderRadius:"50%",
                      width:22,height:22,display:"flex",alignItems:"center",justifyContent:"center",
                      fontSize:11,fontWeight:700,flexShrink:0,marginTop:1
                    }}>{item.n}</div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:12,lineHeight:1.5,color:N.mid}}>{item.task}</div>
                      <div style={{fontSize:10,color:N.muted,marginTop:2}}>Owner: {item.who}</div>
                    </div>
                  </div>
                ))}
              </Card>
            </div>
          </div>
        )}

      </div>

      {/* Footer */}
      <div style={{
        background:B.navy,
        borderTop:`1px solid rgba(255,255,255,0.08)`,
        color:"rgba(255,255,255,0.35)",
        textAlign:"center",
        padding:"16px",
        fontSize:11,
        letterSpacing:"0.3px"
      }}>
        ISPE Delaware Valley Chapter · Membership Committee · 90-Day Engagement Master Plan · Dan Hall, Co-Chair · Internal Working Document
      </div>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>

<script>
  const siteToggle = document.getElementById('siteNavToggle');
  const siteMobileNav = document.getElementById('siteNavMobile');
  siteToggle.addEventListener('click', () => {
    siteToggle.classList.toggle('open');
    siteMobileNav.classList.toggle('open');
  });
  siteMobileNav.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      siteToggle.classList.remove('open');
      siteMobileNav.classList.remove('open');
    });
  });
</script>
</body>
</html>
